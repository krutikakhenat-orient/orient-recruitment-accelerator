        aria-live="polite"

      >
        <img src="/orient-logo.png" width="56" height="56" alt="Orient Recruitment Accelerator logo" onerror="this.src='/orient-logo.svg'" />

      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>

</html>
