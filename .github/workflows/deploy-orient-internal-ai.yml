name: Deploy (Orient_Internal_AI)

# One pipeline for agent + infrastructure + backend + frontend (architecture v2).
# Pull requests: checks only. Push to main: deploy (behind the `orient-internal-ai` environment approval).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # OIDC to AWS
  contents: read

concurrency:
  group: deploy-orient-internal-ai
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  DEPLOY_DIR: Orient_Internal_AI_Deployment
  TF_DIR: Orient_Internal_AI_Deployment/terraform
  TF_IN_AUTOMATION: "true"
  AGENTCORE_CLI_VERSION: "0.31.1"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Backend tests
        working-directory: backend
        run: |
          pip install -e ".[dev]"
          pytest -q
      - name: Frontend tests and build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Amplify Gen 2 backend type check
        working-directory: frontend
        run: npx tsc --noEmit -p amplify
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.12.2" }
      - name: Terraform fmt and validate
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    environment: orient-internal-ai # configure required reviewers for a human release approval
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.12.2" }

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 1. AgentCore interview agent (AgentCore CLI, CodeZip, no Docker)
      - name: Deploy AgentCore agent
        shell: pwsh
        run: |
          npm install -g "@aws/agentcore@${env:AGENTCORE_CLI_VERSION}"
          ./${{ env.DEPLOY_DIR }}/scripts/deploy-agent.ps1 -Profile "" -Region $env:AWS_REGION

      # 2. Lambda package: backend + Data API dialect (linux wheels, no Docker)
      - name: Build Lambda package
        run: |
          OUT=${DEPLOY_DIR}/.build/lambda
          rm -rf "$OUT" && mkdir -p "$OUT"
          python - <<'PY' > /tmp/req.txt
          import tomllib
          print("\n".join(tomllib.load(open("backend/pyproject.toml","rb"))["project"]["dependencies"]))
          PY
          pip install -q --no-cache-dir -r /tmp/req.txt -t "$OUT" \
            --platform manylinux2014_x86_64 --implementation cp --python-version 3.12 --only-binary=:all:
          pip install -q --no-cache-dir --no-deps -r ${DEPLOY_DIR}/lambda-extra-requirements.txt -t "$OUT" --only-binary=:all:
          cp -r backend/app "$OUT/app"
          cp -r backend/alembic "$OUT/migrations"
          cp backend/alembic.ini "$OUT/"
          find "$OUT" -name __pycache__ -type d -prune -exec rm -rf {} +

      # 3. Terraform (remote state in S3)
      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          terraform init -input=false \
            -backend-config="bucket=ora-tfstate-${ACCOUNT}-${AWS_REGION}" \
            -backend-config="key=hr-accelerator/staging/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform apply
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_aws_profile: ""
          TF_VAR_github_repo: ${{ github.repository }}
          TF_VAR_create_github_oidc_provider: ${{ vars.CREATE_GITHUB_OIDC_PROVIDER || 'true' }}
        run: |
          export TF_VAR_agentcore_runtime_arn="$(cat ../.agent_runtime_arn)"
          # app_base_url is known only after the first apply (Amplify domain); reuse it from state.
          BASE=$(terraform output -raw amplify_url 2>/dev/null || true)
          terraform apply -input=false -auto-approve -var "app_base_url=${BASE}"
          NEW=$(terraform output -raw amplify_url)
          if [ "$NEW" != "$BASE" ]; then
            terraform apply -input=false -auto-approve -var "app_base_url=${NEW}"
          fi
          {
            echo "OPS_FN=$(terraform output -raw ops_function_name)"
            echo "AMPLIFY_APP_ID=$(terraform output -raw amplify_app_id)"
            echo "API_ROLE_ARN=$(terraform output -raw api_lambda_role_arn)"
            echo "APP_URL=$(terraform output -raw amplify_url)"
            echo "API_URL=$(terraform output -raw api_url)"
          } >> "$GITHUB_ENV"

      # 4. Only the API Lambda role may invoke the agent runtime
      - name: Lock AgentCore runtime
        shell: pwsh
        run: |
          ./${{ env.DEPLOY_DIR }}/scripts/lock-agent-runtime.ps1 `
            -RuntimeArn (Get-Content ${{ env.DEPLOY_DIR }}/.agent_runtime_arn -Raw).Trim() `
            -ApiLambdaRoleArn $env:API_ROLE_ARN `
            -ExtraAllowedPrincipalArns @("${{ vars.AGENT_ADMIN_ROLE_ARN }}".Trim() | Where-Object { $_ }) `
            -Profile "" -Region $env:AWS_REGION

      # 5. Database migrations through the ops Lambda
      - name: Run database migrations
        run: |
          echo '{"action":"migrate"}' > /tmp/payload.json
          aws lambda invoke --function-name "$OPS_FN" --cli-binary-format raw-in-base64-out \
            --cli-read-timeout 900 --payload file:///tmp/payload.json /tmp/resp.json
          cat /tmp/resp.json
          if grep -qiE '"(errorMessage|error)"' /tmp/resp.json; then exit 1; fi

      # 6. Amplify Gen 2 backend (Cognito)
      - name: Deploy Amplify Gen 2 backend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx ampx pipeline-deploy --branch main --app-id "$AMPLIFY_APP_ID"

      # 7. Frontend to Amplify Hosting
      - name: Publish frontend
        run: |
          (cd frontend && npm run build)
          (cd frontend/dist && zip -qr /tmp/frontend.zip .)
          DEP=$(aws amplify create-deployment --app-id "$AMPLIFY_APP_ID" --branch-name main)
          JOB=$(echo "$DEP" | jq -r .jobId)
          curl -sSf -X PUT -H "Content-Type: application/zip" --data-binary @/tmp/frontend.zip "$(echo "$DEP" | jq -r .zipUploadUrl)"
          aws amplify start-deployment --app-id "$AMPLIFY_APP_ID" --branch-name main --job-id "$JOB"

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$API_URL/health" || true)
            [ "$code" = "200" ] && echo "healthy" && exit 0
            sleep 20   # Aurora may be resuming from auto-pause
          done
          echo "health check failed (last HTTP $code)"; exit 1
