# Local development stack for Orient Recruitment Accelerator.
# Not a production deployment. See docs/deployment.md for production guidance.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ora}
      POSTGRES_DB: ${POSTGRES_DB:-ora}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ora}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NOTE: minio service removed for this deployment — MinIO withdrew its open-source
  # images from Docker Hub/Quay, and the backend's ObjectStore currently defaults to
  # an in-memory implementation (app/modules/documents/storage.py) with no real S3
  # client wired up, so MinIO was unused scaffolding here anyway.

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      ORA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ora}:${POSTGRES_PASSWORD:-ora}@postgres:5432/${POSTGRES_DB:-ora}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    # Apply migrations then start the API. Seed is run manually (synthetic data).
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    depends_on:
      - api
    ports:
      - "5173:5173"

volumes:
  pgdata:
