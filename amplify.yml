version: 1
applications:
  - appRoot: frontend
    backend:
      phases:
        build:
          commands:
            - nvm use 22 || true
            - npm ci --cache .npm --prefer-offline --no-audit --no-fund
            # Amplify Gen 2 backend (Cognito) for this branch.
            - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
    frontend:
      phases:
        preBuild:
          commands:
            - nvm use 22 || true
            - npm ci --cache .npm --prefer-offline --no-audit --no-fund
        build:
          commands:
            - npm test
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - "**/*"
      cache:
        paths:
          - .npm/**/*
          - node_modules/**/*
