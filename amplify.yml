version: 1
applications:
  - appRoot: frontend
    backend:
      phases:
        build:
          commands:
            - nvm use 22 || true
            # The Amplify Gen 2 backend (Cognito) lives in ../amplify-backend so its toolchain (which pins
            # zod 3.25.x) stays separate from the app's dependencies (zod 3.24.1).
            - cd ../amplify-backend
            # `npm install`, not `npm ci`: the lockfile could not be fully resolved on the developer
            # machine (disk space). Top-level versions are still pinned exactly in package.json.
            - npm install --no-audit --no-fund
            - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
    frontend:
      phases:
        preBuild:
          commands:
            - nvm use 22 || true
            - npm ci --cache .npm --prefer-offline --no-audit --no-fund
        build:
          commands:
            - npm test
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - "**/*"
      cache:
        paths:
          - .npm/**/*
          - node_modules/**/*
