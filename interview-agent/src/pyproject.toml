# Runtime dependencies for the AgentCore CodeZip package (installed as arm64 Linux wheels by
# `agentcore deploy`). Must match [project].dependencies in ../pyproject.toml; a test enforces this.
[project]
name = "interview-agent-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.5",
  "uvicorn==0.52.4",
  "websockets==15.0.1",
  "pydantic==2.14.1",
  "pydantic-settings==2.14.1",
  "python-dotenv==1.2.4",
  "boto3==1.43.117",  # matches botocore required by aiobotocore 3.10.0 (pipecat-ai[aws])
  "amazon-transcribe==0.6.4",
  "httpx==0.28.1",
  "pipecat-ai[aws,silero,tracing]==1.15.0",
]

# The AgentCore packager installs with `--only-binary :all:` (no source builds). `docopt`
# (pulled in by pipecat-ai -> num2words) is published only as source, so a pure-Python wheel
# built from that exact version is kept in ../wheels (outside src, so it is not zipped).
# Rebuild it with: pip wheel "docopt==0.6.2" --no-deps -w ../wheels
[tool.uv]
find-links = ["../wheels"]
