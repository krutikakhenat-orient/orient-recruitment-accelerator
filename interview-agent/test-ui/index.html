<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentCore interview agent: test UI (SYNTHETIC DATA ONLY)</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 960px; margin: 1.5rem auto; padding: 0 1rem; color: #1a1a1a; }
  h1 { font-size: 1.3rem; } h2 { font-size: 1.05rem; margin-top: 1.5rem; }
  label { display: block; font-weight: 600; margin-top: .7rem; }
  textarea, input[type=text] { width: 100%; box-sizing: border-box; font: inherit; padding: .4rem; }
  textarea { min-height: 4.5rem; }
  button { font: inherit; padding: .5rem 1rem; margin: .6rem .4rem .6rem 0; cursor: pointer; }
  button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 3px solid #1a56db; outline-offset: 2px; }
  .box { border: 1px solid #888; padding: .6rem; background: #fafafa; overflow: auto; }
  #log { min-height: 12rem; max-height: 24rem; }
  #auth { font: 13px/1.4 ui-monospace, monospace; max-height: 12rem; white-space: pre-wrap; }
  .agent::before { content: "Agent: "; font-weight: 700; }
  .you::before { content: "You: "; font-weight: 700; }
  .sys { color: #555; font-style: italic; }
  .warn { background: #fff4d6; border: 1px solid #c58b00; padding: .5rem; }
  ol { margin: .3rem 0 0 1.2rem; }
</style>
</head>
<body>
<h1>AgentCore interview agent: test UI</h1>
<p class="warn">Testing only. Use synthetic data. Use Chrome or Edge with headphones so the agent does not hear itself.</p>

<h2>1. HR: generate questions</h2>
<label for="role">Role title</label>
<input id="role" type="text" value="Synthetic Backend Engineer">
<label for="jd">Job description</label>
<textarea id="jd">Build and maintain REST APIs in Python with FastAPI. Strong PostgreSQL skills. Experience with AWS and automated testing.</textarea>
<label for="skills">Must-have skills (comma separated)</label>
<input id="skills" type="text" value="Python, PostgreSQL, AWS">
<label for="resume">Resume text</label>
<textarea id="resume">SYNTHETIC RESUME. Four years building Python services with FastAPI and PostgreSQL. Deployed services on AWS Lambda. Wrote pytest suites.</textarea>
<button id="plan">Generate questions</button>
<div id="questions" aria-live="polite"></div>

<h2>2. Candidate: interview</h2>
<label><input id="consent" type="checkbox"> I consent to this interview being transcribed for the hiring team (synthetic test)</label>
<button id="start" disabled>Approve questions and start interview</button>
<button id="end" disabled>End interview</button>
<span id="status" role="status" aria-live="polite">Idle</span>
<div id="log" class="box" aria-live="polite"></div>
<label for="typed">Type an answer instead of speaking (optional)</label>
<input id="typed" type="text" disabled>
<button id="send" disabled>Send</button>

<h2>How authentication happened</h2>
<div id="auth" class="box" aria-live="polite"></div>

<script>
const $ = (id) => document.getElementById(id);
const RATE = 16000;
let ws, ctx, micStream, workletNode, nextPlayTime = 0, playing = [], interviewId = null, questionSet = null;

function line(cls, text) { const d = document.createElement("div"); d.className = cls; d.textContent = text; $("log").appendChild(d); $("log").scrollTop = $("log").scrollHeight; }
function auth(text) { $("auth").textContent += text + "\n"; $("auth").scrollTop = $("auth").scrollHeight; }
function status(t) { $("status").textContent = t; }

async function post(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail ? JSON.stringify(j.detail) : "HTTP " + r.status);
  return j;
}

$("plan").onclick = async () => {
  $("plan").disabled = true; $("questions").textContent = "Generating questions..."; $("auth").textContent = "";
  try {
    const skills = $("skills").value.split(",").map((s) => s.trim()).filter(Boolean);
    auth("Browser -> broker POST /api/interviews (no AWS credentials in the browser)");
    const r = await post("/api/interviews", { role_title: $("role").value, jd_text: $("jd").value, skills, resume_text: $("resume").value });
    auth("Broker -> AgentCore InvokeAgentRuntime {plan_questions}, signed with SigV4 using the broker's AWS identity (" + r.seconds + " s)");
    interviewId = r.interview_id; questionSet = r.question_set;
    const ol = document.createElement("ol");
    questionSet.questions.forEach((q) => { const li = document.createElement("li"); li.textContent = q.text; ol.appendChild(li); });
    $("questions").textContent = "Draft questions (" + questionSet.generated_by + "). In the real app HR reviews and approves these:";
    $("questions").appendChild(ol);
    $("start").disabled = false;
  } catch (e) { $("questions").textContent = "Failed: " + e.message; }
  $("plan").disabled = false;
};

const WORKLET = `
class Pcm16 extends AudioWorkletProcessor {
  constructor() { super(); this.buf = []; }
  process(inputs) {
    const ch = inputs[0][0];
    if (ch) {
      for (let i = 0; i < ch.length; i++) this.buf.push(Math.max(-1, Math.min(1, ch[i])));
      while (this.buf.length >= 1600) {
        const out = new Int16Array(1600);
        for (let i = 0; i < 1600; i++) out[i] = this.buf[i] * 32767;
        this.buf = this.buf.slice(1600);
        this.port.postMessage(out.buffer, [out.buffer]);
      }
    }
    return true;
  }
}
registerProcessor("pcm16", Pcm16);`;

function playPcm(buffer) {
  const i16 = new Int16Array(buffer); if (!i16.length) return;
  const f32 = new Float32Array(i16.length); for (let i = 0; i < i16.length; i++) f32[i] = i16[i] / 32768;
  const b = ctx.createBuffer(1, f32.length, RATE); b.copyToChannel(f32, 0);
  const src = ctx.createBufferSource(); src.buffer = b; src.connect(ctx.destination);
  nextPlayTime = Math.max(nextPlayTime, ctx.currentTime + 0.05); src.start(nextPlayTime); nextPlayTime += b.duration;
  playing.push(src); src.onended = () => { playing = playing.filter((s) => s !== src); };
}
function clearPlayback() { playing.forEach((s) => { try { s.stop(); } catch (e) {} }); playing = []; nextPlayTime = 0; }

async function startMic() {
  micStream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
  await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], { type: "application/javascript" })));
  workletNode = new AudioWorkletNode(ctx, "pcm16");
  workletNode.port.onmessage = (e) => { if (ws && ws.readyState === 1) ws.send(e.data); };
  ctx.createMediaStreamSource(micStream).connect(workletNode);
}

function cleanup() {
  clearPlayback();
  if (micStream) micStream.getTracks().forEach((t) => t.stop());
  if (ctx) ctx.close();
  micStream = ctx = workletNode = null;
  $("end").disabled = true; $("typed").disabled = true; $("send").disabled = true; $("plan").disabled = false;
  if (interviewId) post("/api/interviews/" + interviewId + "/stop").catch(() => {});
  interviewId = null; questionSet = null;
}

$("start").onclick = async () => {
  if (!$("consent").checked) { status("Consent is required to start"); $("consent").focus(); return; }
  $("start").disabled = true; $("plan").disabled = true; $("log").textContent = "";
  try {
    status("Preparing session...");
    ctx = new AudioContext({ sampleRate: RATE }); await ctx.resume();   // needs the click gesture
    await startMic();
    auth("Browser -> broker POST /api/interviews/{id}/join (consent=true)");
    const j = await post("/api/interviews/" + interviewId + "/join", { question_set: questionSet, consent_given: true });
    const u = new URL(j.ws_url);
    auth("Broker -> AgentCore InvokeAgentRuntime {prepare_session} on runtime session S -> single-use join_token");
    auth("Broker signed a WebSocket URL locally (SigV4 query auth, expires in " + j.expires_in + " s). Query params: " +
         [...u.searchParams.keys()].join(", "));
    auth("Browser -> wss://" + u.host + "/runtimes/<ARN>/ws (AgentCore checks the signature; no keys in the browser)");
    ws = new WebSocket(j.ws_url); ws.binaryType = "arraybuffer";
    ws.onopen = () => { auth("WebSocket open. Browser sends {start, interview_id, join_token}; the agent checks the token once"); ws.send(JSON.stringify({ type: "start", interview_id: interviewId, join_token: j.join_token })); };
    ws.onmessage = (e) => {
      if (typeof e.data !== "string") return playPcm(e.data);
      const m = JSON.parse(e.data);
      if (m.type === "ready") { status("Live: speak after the agent finishes"); $("end").disabled = false; $("typed").disabled = !m.text_input; $("send").disabled = !m.text_input; }
      else if (m.type === "agent_text") line("agent", m.text);
      else if (m.type === "transcript" && m.final) line("you", m.text);
      else if (m.type === "clear") clearPlayback();
      else if (m.type === "warning") line("sys", "Warning: " + m.code);
      else if (m.type === "error") { line("sys", "Error: " + m.code); status("Error"); }
      else if (m.type === "ended") { status("Ended (" + m.reason + "). Saved to S3."); line("sys", "Interview ended: " + m.reason); }
    };
    ws.onerror = () => auth("WebSocket error (check the broker console; a URL older than " + j.expires_in + " s is rejected)");
    ws.onclose = (ev) => { auth("WebSocket closed (code " + ev.code + ")"); status("Disconnected"); cleanup(); };
  } catch (e) { line("sys", "Failed: " + e.message); status("Failed"); cleanup(); }
};
$("end").onclick = () => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "end" })); };
$("send").onclick = () => { const t = $("typed").value.trim(); if (t && ws && ws.readyState === 1) { ws.send(JSON.stringify({ type: "utterance", text: t })); $("typed").value = ""; } };
$("typed").addEventListener("keydown", (e) => { if (e.key === "Enter") $("send").click(); });
</script>
</body>
</html>
